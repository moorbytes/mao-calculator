<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>MAO Calculator</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-main: #333333;
            --text-light: #666666;
            --row-alt: #f9f9f9;
            --border-line: #eaeaea;
            --input-bg: #f5f5f5;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 30px 20px; max-width: 800px; margin: 0 auto; }
        
        h1 { font-size: 28px; font-weight: 400; margin-bottom: 30px; color: #1a1a1a; }
        
        /* Table Styles */
        .breakdown-table { width: 100%; border-collapse: collapse; margin-bottom: 40px; font-size: 15px; }
        .breakdown-table th { text-align: left; padding: 12px 15px; border-bottom: 1px solid #333; font-weight: 600; color: #444; }
        .breakdown-table td { padding: 15px; border-bottom: none; }
        .breakdown-table tr:nth-child(even) td { background-color: var(--row-alt); }
        .amount-col { text-align: right; }
        th.amount-col { text-align: right; }

        hr { border: none; border-top: 1px solid var(--border-line); margin: 30px 0; }

        /* Summary Section */
        .summary-section { text-align: center; margin: 30px 0; }
        .summary-label { font-size: 18px; color: var(--text-light); margin-bottom: 10px; }
        .summary-value { font-size: 24px; font-family: monospace; font-weight: 400; color: #1a1a1a; }

        /* Input Controls Layout */
        .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: center; margin-bottom: 30px; }
        .input-group { display: flex; align-items: center; gap: 10px; }
        .input-group label { font-size: 15px; color: #1a1a1a; white-space: nowrap; }
        
        input[type="number"] {
            width: 100%;
            padding: 12px 15px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            background-color: var(--input-bg);
            outline: none;
        }

        /* Slider Row */
        .slider-row { display: flex; align-items: center; gap: 20px; margin-top: 20px; }
        .slider-row label { font-size: 15px; color: #1a1a1a; white-space: nowrap; min-width: 140px; }
        input[type="range"] { flex-grow: 1; -webkit-appearance: none; background: #ddd; height: 4px; border-radius: 2px; outline: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 30px; background: #1a1a1a; cursor: pointer; border-radius: 2px; }
        .slider-output { background-color: var(--input-bg); padding: 12px 20px; border-radius: 8px; font-size: 16px; min-width: 60px; text-align: center; }

        @media (max-width: 600px) {
            .controls-grid { grid-template-columns: 1fr; }
            .slider-row { flex-direction: column; align-items: flex-start; gap: 10px; }
            .slider-row input[type="range"] { width: 100%; }
        }
    </style>
</head>
<body>

    <h1>MAO Calculator</h1>

    <table class="breakdown-table">
        <thead>
            <tr>
                <th>Phase</th>
                <th>Description</th>
                <th class="amount-col">Amount</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Property ARV</td>
                <td>Target Market Value</td>
                <td class="amount-col" id="tbl-arv">$100,000</td>
            </tr>
            <tr>
                <td>Rule Target</td>
                <td id="tbl-rule-desc">66% Multiplier</td>
                <td class="amount-col" id="tbl-target">$66,000</td>
            </tr>
            <tr>
                <td>Repair Budget</td>
                <td>Est. Renovation Costs</td>
                <td class="amount-col" id="tbl-repairs">-$30,000</td>
            </tr>
            <tr>
                <td>Final MAO</td>
                <td>Max Purchase Price</td>
                <td class="amount-col" id="tbl-mao">$36,000</td>
            </tr>
        </tbody>
    </table>

    <hr>

    <div class="summary-section">
        <div class="summary-label">Max Allowable Offer</div>
        <div class="summary-value" id="main-mao">$36,000</div>
    </div>

    <hr>

    <div class="controls-grid">
        <div class="input-group">
            <label for="arv">After Repair Value ($)</label>
            <input type="number" id="arv" value="100000" inputmode="numeric">
        </div>
        <div class="input-group">
            <label for="repairs">Repair Costs ($)</label>
            <input type="number" id="repairs" value="30000" inputmode="numeric">
        </div>
    </div>

    <div class="slider-row">
        <label for="rule">Offer % (MAO Rule)</label>
        <input type="range" id="rule" min="60" max="85" value="66" step="1">
        <div class="slider-output" id="ruleDisplay">66</div>
    </div>

<script>
    const arvInput = document.getElementById('arv');
    const repairsInput = document.getElementById('repairs');
    const ruleSlider = document.getElementById('rule');
    const ruleDisplay = document.getElementById('ruleDisplay');
    
    // Table Elements
    const tblArv = document.getElementById('tbl-arv');
    const tblRuleDesc = document.getElementById('tbl-rule-desc');
    const tblTarget = document.getElementById('tbl-target');
    const tblRepairs = document.getElementById('tbl-repairs');
    const tblMao = document.getElementById('tbl-mao');
    
    // Main Display
    const mainMao = document.getElementById('main-mao');

    const formatCurrency = (num) => {
        return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(num);
    };

    function calculate() {
        const arv = parseFloat(arvInput.value) || 0;
        const repairs = parseFloat(repairsInput.value) || 0;
        const rule = parseFloat(ruleSlider.value);
        const ruleDecimal = rule / 100;

        const target = arv * ruleDecimal;
        let mao = target - repairs;
        if (mao < 0) mao = 0;

        // Update Table
        tblArv.innerText = formatCurrency(arv);
        tblRuleDesc.innerText = rule + '% Multiplier';
        tblTarget.innerText = formatCurrency(target);
        tblRepairs.innerText = '-' + formatCurrency(repairs);
        tblMao.innerText = formatCurrency(mao);

        // Update Main Output
        mainMao.innerText = formatCurrency(mao);
    }

    // Event Listeners
    arvInput.addEventListener('input', calculate);
    repairsInput.addEventListener('input', calculate);
    ruleSlider.addEventListener('input', function() {
        ruleDisplay.innerText = this.value;
        calculate();
    });

    // Init
    calculate();
</script>

</body>
</html>
