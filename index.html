<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>MAO Calculator</title>
    <style>
        :root {
            /* Up Morningside Brand Colors - Darkened */
            --bg-color: #ffffff;
            --primary-navy: #2c3e55; /* Rich Slate Navy */
            --accent-orange: #d95a1c; /* Deepened Brand Orange */
            --text-main: #2d3748;
            --text-light: #4a5568;
            --row-alt: #f4f6f9; /* Light blueish-gray tint */
            --border-line: #cbd5e1;
            --input-bg: #edf2f7;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 30px 20px; max-width: 800px; margin: 0 auto; }
        
        h1 { font-size: 28px; font-weight: 700; margin-bottom: 30px; color: var(--primary-navy); border-left: 5px solid var(--accent-orange); padding-left: 12px;}
        
        /* Table Styles */
        .breakdown-table { width: 100%; border-collapse: collapse; margin-bottom: 40px; font-size: 15px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .breakdown-table th { text-align: left; padding: 12px 15px; border-bottom: 2px solid var(--primary-navy); font-weight: 700; color: var(--primary-navy); text-transform: uppercase; font-size: 13px; letter-spacing: 0.5px; }
        .breakdown-table td { padding: 15px; border-bottom: 1px solid var(--border-line); }
        .breakdown-table tr:nth-child(even) td { background-color: var(--row-alt); }
        .amount-col { text-align: right; font-weight: 600; }
        th.amount-col { text-align: right; }

        hr { border: none; border-top: 2px dashed var(--border-line); margin: 30px 0; }

        /* Summary Section */
        .summary-section { text-align: center; margin: 35px 0; background-color: var(--primary-navy); padding: 25px; border-radius: 12px; color: white; box-shadow: 0 10px 15px -3px rgba(44, 62, 85, 0.3); }
        .summary-label { font-size: 14px; opacity: 0.9; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
        .summary-value { font-size: 38px; font-weight: 800; color: #ffffff; }
        .summary-highlight { color: var(--accent-orange); }

        /* Input Controls Layout */
        .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: center; margin-bottom: 30px; }
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-group label { font-size: 14px; font-weight: 600; color: var(--primary-navy); }
        
        input[type="number"] {
            width: 100%;
            padding: 14px 15px;
            font-size: 16px;
            font-weight: 600;
            color: var(--primary-navy);
            border: 2px solid transparent;
            border-radius: 8px;
            background-color: var(--input-bg);
            outline: none;
            transition: all 0.2s ease;
        }
        input[type="number"]:focus { border-color: var(--accent-orange); background-color: #ffffff; box-shadow: 0 0 0 3px rgba(217, 90, 28, 0.1); }

        /* Slider Row */
        .slider-row { display: flex; align-items: center; gap: 20px; margin-top: 25px; background: var(--row-alt); padding: 20px; border-radius: 12px; }
        .slider-row label { font-size: 14px; font-weight: 600; color: var(--primary-navy); white-space: nowrap; min-width: 130px; }
        input[type="range"] { flex-grow: 1; -webkit-appearance: none; background: #cbd5e1; height: 6px; border-radius: 3px; outline: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 22px; height: 22px; background: var(--accent-orange); cursor: pointer; border-radius: 50%; border: 3px solid #ffffff; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .slider-output { background-color: var(--primary-navy); color: white; padding: 8px 16px; border-radius: 6px; font-size: 16px; font-weight: 700; min-width: 60px; text-align: center; }

        @media (max-width: 600px) {
            .controls-grid { grid-template-columns: 1fr; }
            .slider-row { flex-direction: column; align-items: stretch; gap: 15px; }
            .slider-row label { min-width: auto; }
        }
    </style>
</head>
<body>

    <h1>Deal Analyzer</h1>

    <table class="breakdown-table">
        <thead>
            <tr>
                <th>Phase</th>
                <th>Description</th>
                <th class="amount-col">Amount</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Property ARV</td>
                <td>Target Market Value</td>
                <td class="amount-col" id="tbl-arv">$100,000</td>
            </tr>
            <tr>
                <td>Rule Target</td>
                <td id="tbl-rule-desc">66% Multiplier</td>
                <td class="amount-col" id="tbl-target">$66,000</td>
            </tr>
            <tr>
                <td>Repair Budget</td>
                <td>Est. Renovation Costs</td>
                <td class="amount-col" id="tbl-repairs" style="color: var(--accent-orange);">-$30,000</td>
            </tr>
            <tr>
                <td>Final MAO</td>
                <td>Max Purchase Price</td>
                <td class="amount-col" id="tbl-mao">$36,000</td>
            </tr>
        </tbody>
    </table>

    <div class="summary-section">
        <div class="summary-label">Max Allowable Offer</div>
        <div class="summary-value" id="main-mao">$36,000</div>
    </div>

    <div class="controls-grid">
        <div class="input-group">
            <label for="arv">After Repair Value ($)</label>
            <input type="number" id="arv" value="100000" inputmode="numeric">
        </div>
        <div class="input-group">
            <label for="repairs">Repair Costs ($)</label>
            <input type="number" id="repairs" value="30000" inputmode="numeric">
        </div>
    </div>

    <div class="slider-row">
        <label for="rule">Offer % (MAO Rule)</label>
        <input type="range" id="rule" min="60" max="85" value="66" step="1">
        <div class="slider-output" id="ruleDisplay">66%</div>
    </div>

<script>
    const arvInput = document.getElementById('arv');
    const repairsInput = document.getElementById('repairs');
    const ruleSlider = document.getElementById('rule');
    const ruleDisplay = document.getElementById('ruleDisplay');
    
    // Table Elements
    const tblArv = document.getElementById('tbl-arv');
    const tblRuleDesc = document.getElementById('tbl-rule-desc');
    const tblTarget = document.getElementById('tbl-target');
    const tblRepairs = document.getElementById('tbl-repairs');
    const tblMao = document.getElementById('tbl-mao');
    
    // Main Display
    const mainMao = document.getElementById('main-mao');

    const formatCurrency = (num) => {
        return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(num);
    };

    function calculate() {
        const arv = parseFloat(arvInput.value) || 0;
        const repairs = parseFloat(repairsInput.value) || 0;
        const rule = parseFloat(ruleSlider.value);
        const ruleDecimal = rule / 100;

        const target = arv * ruleDecimal;
        let mao = target - repairs;
        if (mao < 0) mao = 0;

        // Update Table
        tblArv.innerText = formatCurrency(arv);
        tblRuleDesc.innerText = rule + '% Multiplier';
        tblTarget.innerText = formatCurrency(target);
        tblRepairs.innerText = '-' + formatCurrency(repairs);
        tblMao.innerText = formatCurrency(mao);

        // Update Main Output
        mainMao.innerText = formatCurrency(mao);
    }

    // Event Listeners
    arvInput.addEventListener('input', calculate);
    repairsInput.addEventListener('input', calculate);
    ruleSlider.addEventListener('input', function() {
        ruleDisplay.innerText = this.value + '%';
        calculate();
    });

    // Init
    calculate();
</script>

</body>
</html>
