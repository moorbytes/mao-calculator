<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>MAO Calculator</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --primary: #2c3e50;
            --accent: #27ae60;
            --text: #333333;
            --border: #e0e0e0;
        }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-color); margin: 0; padding: 20px; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; color: var(--text); }
        .app-container { background: var(--card-bg); width: 100%; max-width: 400px; padding: 30px 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); margin-top: 20px; }
        h1 { text-align: center; color: var(--primary); font-size: 24px; margin-top: 0; margin-bottom: 30px; }
        .input-group { margin-bottom: 25px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; color: var(--primary); font-size: 14px; }
        input[type="number"] { width: 100%; padding: 15px; font-size: 18px; border: 2px solid var(--border); border-radius: 10px; outline: none; transition: border 0.3s; background: #fafafa; }
        input[type="number"]:focus { border-color: var(--accent); }
        .slider-container { display: flex; align-items: center; justify-content: space-between; }
        input[type="range"] { flex-grow: 1; margin-right: 15px; }
        .slider-value { font-weight: bold; font-size: 18px; color: var(--accent); min-width: 45px; text-align: right; }
        .result-card { background: var(--primary); color: white; padding: 25px 20px; border-radius: 15px; text-align: center; margin-top: 30px; }
        .result-label { font-size: 14px; opacity: 0.8; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
        .result-value { font-size: 36px; font-weight: bold; margin: 0; color: #2ecc71; }
        .currency-symbol { position: relative; }
        .currency-symbol::before { content: "$"; position: absolute; left: 15px; top: 15px; font-size: 18px; color: #888; z-index: 1; }
        .currency-symbol input { padding-left: 35px; }
    </style>
</head>
<body>

<div class="app-container">
    <h1>Deal Analyzer</h1>

    <div class="input-group currency-symbol">
        <label for="arv">After Repair Value (ARV)</label>
        <input type="number" id="arv" placeholder="150000" inputmode="numeric">
    </div>

    <div class="input-group currency-symbol">
        <label for="repairs">Total Repair Estimate</label>
        <input type="number" id="repairs" placeholder="33000" inputmode="numeric">
    </div>

    <div class="input-group">
        <label for="rule">Max Offer Percentage (Rule)</label>
        <div class="slider-container">
            <input type="range" id="rule" min="60" max="85" value="70" step="1">
            <span class="slider-value" id="ruleDisplay">70%</span>
        </div>
    </div>

    <div class="result-card">
        <div class="result-label">Maximum Allowable Offer</div>
        <div class="result-value" id="maoResult">$0</div>
    </div>
</div>

<script>
    const arvInput = document.getElementById('arv');
    const repairsInput = document.getElementById('repairs');
    const ruleSlider = document.getElementById('rule');
    const ruleDisplay = document.getElementById('ruleDisplay');
    const maoResult = document.getElementById('maoResult');

    function calculateMAO() {
        const arv = parseFloat(arvInput.value) || 0;
        const repairs = parseFloat(repairsInput.value) || 0;
        const rule = parseFloat(ruleSlider.value) / 100;

        let mao = (arv * rule) - repairs;
        if (mao < 0) mao = 0;

        // Format as currency
        maoResult.innerText = new Intl.NumberFormat('en-US', {
            style: 'currency',
            currency: 'USD',
            maximumFractionDigits: 0
        }).format(mao);
    }

    // Event Listeners to auto-calculate as you type or slide
    arvInput.addEventListener('input', calculateMAO);
    repairsInput.addEventListener('input', calculateMAO);
    ruleSlider.addEventListener('input', function() {
        ruleDisplay.innerText = this.value + '%';
        calculateMAO();
    });

    // Run once on load
    calculateMAO();
</script>

</body>
</html>
